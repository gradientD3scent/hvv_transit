<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HVV Tagesreplay</title>
  </head>
  <body>
    <div id="map"></div>
    <div id="uhr" hidden>
      <div id="uhr-zeit"></div>
      <div id="uhr-fahrt"></div>
    </div>
    <div id="steuerung" hidden>
      <input id="tagwahl" type="date" />
      <button id="playpause" title="Play/Pause">⏸</button>
      <input id="zeitregler" type="range" min="0" max="86400" step="10" value="0" />
      <span id="tempo-stufen"></span>
    </div>
    <div id="legende" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
